<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午餐訂購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EC; --surface:#FFFFFF; --ink:#2B2A25; --ink-soft:#6B6558;
    --line:#E5DCC6; --green:#42583F; --green-soft:#EAEEE2;
    --yolk:#E2A33B; --yolk-soft:#FBF0DC; --clay:#B5573C; --clay-soft:#F7E7E1; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px;}
  header.top{margin-bottom:22px;}
  header.top h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:26px;margin:0 0 4px;color:var(--green);}
  header.top p{margin:0;color:var(--ink-soft);font-size:14px;}

  nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  nav.tabs button{appearance:none;border:none;background:none;cursor:pointer;padding:10px 4px;margin-right:18px;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:500;color:var(--ink-soft);border-bottom:2px solid transparent;transition:color .15s, border-color .15s;}
  nav.tabs button.active{color:var(--green);border-bottom-color:var(--green);font-weight:700;}
  nav.tabs button:hover{color:var(--green);}
  nav.tabs button.admin-tab{display:none;}

  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h2{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 12px;color:var(--ink);}
  .card h2 small{font-family:'Noto Sans TC',sans-serif;font-weight:400;color:var(--ink-soft);font-size:12.5px;margin-left:6px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  input[type=text], input[type=number], input[type=password], textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:'Noto Sans TC',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:64px;}
  input:focus, textarea:focus{outline:2px solid var(--green);outline-offset:1px;}

  .menu-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .menu-row:last-child{border-bottom:none;}
  .menu-row .info{flex:1;}
  .menu-row .name{font-weight:500;}
  .menu-row .price{color:var(--ink-soft);font-size:13px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--green-soft);color:var(--green);font-size:17px;cursor:pointer;line-height:1;}
  .stepper button:hover{background:var(--green);color:#fff;}
  .stepper .qty{min-width:20px;text-align:center;font-weight:700;}
  .order-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line);font-size:15px;}
  .order-total b{font-size:19px;color:var(--clay);}

  button.primary{appearance:none;border:none;cursor:pointer;background:var(--green);color:#fff;padding:11px 22px;border-radius:8px;font-family:'Noto Sans TC',sans-serif;font-size:14.5px;font-weight:700;width:100%;margin-top:12px;}
  button.primary:hover{background:#354833;}
  button.secondary{appearance:none;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--ink);padding:9px 16px;border-radius:8px;font-size:13.5px;}
  button.secondary:hover{border-color:var(--green);color:var(--green);}
  button.danger-text{appearance:none;border:none;background:none;cursor:pointer;color:var(--clay);font-size:13px;padding:4px 6px;}
  button.danger-text:hover{text-decoration:underline;}

  .add-item-form{display:flex;gap:8px;margin-top:14px;}
  .add-item-form input[type=text]{flex:2;}
  .add-item-form input[type=number]{flex:1;}
  .empty{color:var(--ink-soft);font-size:13.5px;padding:6px 0;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:500;font-size:12.5px;}
  tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:none;}
  td.num, th.num{text-align:right;}
  .remark-tag{display:inline-block;background:var(--yolk-soft);color:#8a5a10;padding:2px 8px;border-radius:6px;font-size:12px;margin-top:3px;}
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;}
  .toggle-row button{flex:1;}
  .toggle-row button.active{background:var(--green);color:#fff;border-color:var(--green);}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .copy-box{background:var(--yolk-soft);border:1px solid #EAD1A0;border-radius:8px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;margin-top:10px;}
  .name-pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .name-pill{background:var(--green-soft);color:var(--green);font-size:12.5px;padding:4px 10px;border-radius:14px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .admin-entry{text-align:center;margin-top:34px;}
  .admin-entry button{appearance:none;border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:12px;text-decoration:underline;opacity:.6;}
  .admin-entry button:hover{opacity:1;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,42,37,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--surface);border-radius:var(--radius);padding:24px 22px;max-width:320px;width:100%;text-align:center;}
  .modal-box h3{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 6px;color:var(--green);}
  .modal-box p{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
  #lock-error{color:var(--clay);font-size:12.5px;margin-top:8px;display:none;}
  .modal-actions{display:flex;gap:8px;margin-top:12px;}
  .modal-actions button{flex:1;}

  .upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:var(--green-soft);}
  .upload-box:hover{border-color:var(--green);}
  .upload-box input{display:none;}
  .ocr-status{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  .ocr-result-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .ocr-result-row:last-child{border-bottom:none;}
  .ocr-result-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;}
  .ocr-result-row .fields{flex:1;display:flex;gap:8px;}
  .ocr-result-row .fields input{padding:6px 8px;font-size:13.5px;}
  .ocr-result-row .fields input.name{flex:2;}
  .ocr-result-row .fields input.price{flex:1;}
  img.preview{max-width:100%;border-radius:8px;margin-top:12px;border:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>午餐訂購</h1>
    <p id="page-subtitle">選好餐點、填上姓名送出就完成了。</p>
  </header>

  <nav class="tabs">
    <button data-tab="order" class="active">點餐</button>
    <button data-tab="menu" class="admin-tab">菜單設定</button>
    <button data-tab="stats" class="admin-tab">統計總覽</button>
  </nav>

  <!-- ORDER PANEL (everyone sees this) -->
  <section class="panel active" id="panel-order">
    <div class="card" id="order-menu-card">
      <h2>今天想吃什麼<small id="menu-empty-hint" style="display:none;">目前還沒有菜單，請等待管理者設定</small></h2>
      <div id="order-menu-list"></div>
      <div class="order-total"><span>目前小計</span><b id="order-total-amount">$0</b></div>
    </div>
    <div class="card">
      <h2>你的資訊</h2>
      <label for="order-name">姓名</label>
      <input type="text" id="order-name" placeholder="例如：小美">
      <div style="height:12px;"></div>
      <label for="order-remark">備註（特殊需求，例如不要辣、過敏原、少飯）</label>
      <textarea id="order-remark" placeholder="沒有的話可以留空"></textarea>
      <button class="primary" id="submit-order">送出訂單</button>
      <p class="hint">同名再次送出會覆蓋你先前的訂單，方便修改內容。</p>
    </div>
    <div class="card">
      <h2>目前已訂購 <small id="order-count-hint"></small></h2>
      <div class="name-pill-row" id="order-name-pills"></div>
      <p class="empty" id="order-none-yet" style="display:none;">還沒有人訂購</p>
    </div>
  </section>

  <!-- MENU ADMIN PANEL (locked) -->
  <section class="panel" id="panel-menu">
    <div class="card">
      <h2>上傳菜單照片自動辨識<small>拍照或截圖都可以，辨識後可以再確認、編輯</small></h2>
      <label class="upload-box" for="menu-image-input">
        <div>點這裡選擇圖片，或拖曳圖片到這裡</div>
        <input type="file" id="menu-image-input" accept="image/*">
      </label>
      <img class="preview" id="image-preview" style="display:none;">
      <div class="ocr-status" id="ocr-status"></div>
      <div id="ocr-results" style="margin-top:14px;"></div>
      <button class="primary" id="ocr-confirm-btn" style="display:none;">把勾選的品項加入菜單</button>
    </div>
    <div class="card">
      <h2>菜單品項</h2>
      <div id="menu-admin-list"></div>
      <p class="empty" id="menu-admin-empty" style="display:none;">還沒有任何品項，可以上傳圖片辨識，或在下方手動新增</p>
      <div class="add-item-form">
        <input type="text" id="new-item-name" placeholder="品項名稱，例如：雞腿便當">
        <input type="number" id="new-item-price" placeholder="價格">
        <button class="secondary" id="add-item-btn">新增</button>
      </div>
    </div>
    <div class="card">
      <h2>快速貼上菜單文字<small>每行一個品項，格式如「雞腿便當 90」或「雞腿便當,90」</small></h2>
      <textarea id="bulk-menu" placeholder="雞腿便當 90&#10;排骨便當 85&#10;素食便當 80"></textarea>
      <button class="secondary" id="bulk-add-btn" style="margin-top:10px;">加入這些品項</button>
    </div>
  </section>

  <!-- STATS PANEL (locked) -->
  <section class="panel" id="panel-stats">
    <div class="toggle-row">
      <button class="secondary active" data-view="byperson">依訂購人</button>
      <button class="secondary" data-view="byitem">依餐點（叫貨用）</button>
    </div>
    <div class="card" id="stats-byperson">
      <h2>每個人訂了什麼</h2>
      <div id="stats-person-table"></div>
    </div>
    <div class="card" id="stats-byitem" style="display:none;">
      <h2>依餐點統計數量</h2>
      <div id="stats-item-table"></div>
      <div class="row-between" style="margin-top:12px;">
        <button class="secondary" id="copy-order-script">複製成電話訂購文字</button>
      </div>
      <div class="copy-box" id="copy-box" style="display:none;"></div>
    </div>
    <div class="card">
      <h2>特殊需求備註</h2>
      <div id="stats-remarks"></div>
      <p class="empty" id="remarks-empty" style="display:none;">目前沒有人填寫備註</p>
    </div>
    <div class="card">
      <div class="row-between">
        <span style="font-size:13px;color:var(--ink-soft);">結束這輪訂購、準備下一次時可以清空名單（菜單會保留）</span>
        <button class="danger-text" id="clear-orders-btn">清空所有訂單</button>
      </div>
    </div>
  </section>

  <div class="admin-entry"><button id="open-admin-link">後台管理</button></div>
</div>

<!-- PIN modal -->
<div class="modal-overlay" id="lock-modal">
  <div class="modal-box">
    <h3>後台管理</h3>
    <p id="lock-desc">請輸入管理密碼</p>
    <input type="password" id="pin-input" placeholder="密碼">
    <p id="lock-error">密碼不正確，請再試一次</p>
    <div class="modal-actions">
      <button class="secondary" id="pin-cancel">取消</button>
      <button class="primary" id="pin-submit" style="margin-top:0;">進入後台</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let menu = [];
let orders = [];
let orderQty = {};
let adminPin = null;
let ocrProposals = [];

function fmt(n){ return '$' + Number(n).toLocaleString(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// ---------- DATA ----------
async function loadData(){
  try{ const m = await window.storage.get('menu', true); menu = m ? JSON.parse(m.value) : []; }catch(e){ menu = []; }
  try{ const o = await window.storage.get('orders', true); orders = o ? JSON.parse(o.value) : []; }catch(e){ orders = []; }
  menu.forEach(it => { if(!(it.id in orderQty)) orderQty[it.id] = 0; });
  renderAll();
}
async function saveMenu(){ try{ await window.storage.set('menu', JSON.stringify(menu), true); }catch(e){ showToast('儲存菜單失敗，請重試'); } }
async function saveOrders(){ try{ await window.storage.set('orders', JSON.stringify(orders), true); }catch(e){ showToast('送出失敗，請重試'); } }

function renderAll(){
  renderOrderMenu();
  renderOrderNames();
  renderMenuAdmin();
  renderStats();
}

// ---------- ORDER PANEL ----------
function renderOrderMenu(){
  const list = document.getElementById('order-menu-list');
  const emptyHint = document.getElementById('menu-empty-hint');
  list.innerHTML = '';
  if(menu.length === 0){ emptyHint.style.display = 'inline'; updateOrderTotal(); return; }
  emptyHint.style.display = 'none';
  menu.forEach(item=>{
    const qty = orderQty[item.id] || 0;
    const row = document.createElement('div');
    row.className = 'menu-row';
    row.innerHTML = `
      <div class="info"><div class="name">${escapeHtml(item.name)}</div><div class="price">${fmt(item.price)}</div></div>
      <div class="stepper">
        <button data-act="minus" data-id="${item.id}" aria-label="減少">−</button>
        <span class="qty" id="qty-${item.id}">${qty}</span>
        <button data-act="plus" data-id="${item.id}" aria-label="增加">+</button>
      </div>`;
    list.appendChild(row);
  });
  list.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const delta = btn.dataset.act === 'plus' ? 1 : -1;
      orderQty[id] = Math.max(0, (orderQty[id]||0) + delta);
      document.getElementById('qty-'+id).textContent = orderQty[id];
      updateOrderTotal();
    });
  });
  updateOrderTotal();
}

function updateOrderTotal(){
  let total = 0;
  menu.forEach(item=>{ total += (orderQty[item.id]||0) * item.price; });
  document.getElementById('order-total-amount').textContent = fmt(total);
}

function renderOrderNames(){
  const pillRow = document.getElementById('order-name-pills');
  const noneYet = document.getElementById('order-none-yet');
  const countHint = document.getElementById('order-count-hint');
  pillRow.innerHTML = '';
  if(orders.length === 0){ noneYet.style.display = 'block'; countHint.textContent = ''; return; }
  noneYet.style.display = 'none';
  countHint.textContent = `（共 ${orders.length} 人）`;
  orders.forEach(o=>{
    const pill = document.createElement('span');
    pill.className = 'name-pill';
    pill.textContent = o.name;
    pillRow.appendChild(pill);
  });
}

async function submitOrder(){
  const nameInput = document.getElementById('order-name');
  const remarkInput = document.getElementById('order-remark');
  const name = nameInput.value.trim();
  if(!name){ showToast('請先填寫姓名'); nameInput.focus(); return; }
  const items = menu.filter(it => (orderQty[it.id]||0) > 0)
    .map(it => ({ itemId: it.id, name: it.name, price: it.price, qty: orderQty[it.id] }));
  if(items.length === 0){ showToast('請至少選擇一項餐點'); return; }

  const existingIdx = orders.findIndex(o => o.name === name);
  const entry = { id: existingIdx>=0 ? orders[existingIdx].id : uid(), name, items, remark: remarkInput.value.trim(), ts: Date.now() };
  if(existingIdx >= 0){ orders[existingIdx] = entry; showToast('已更新 ' + name + ' 的訂單'); }
  else{ orders.push(entry); showToast('已送出 ' + name + ' 的訂單'); }

  await saveOrders();
  menu.forEach(it => orderQty[it.id] = 0);
  remarkInput.value = '';
  renderOrderMenu();
  renderOrderNames();
  renderStats();
}
document.getElementById('submit-order').addEventListener('click', submitOrder);

// ---------- MENU ADMIN ----------
function renderMenuAdmin(){
  const list = document.getElementById('menu-admin-list');
  const empty = document.getElementById('menu-admin-empty');
  list.innerHTML = '';
  if(menu.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  menu.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'menu-row';
    row.innerHTML = `
      <div class="info"><div class="name">${escapeHtml(item.name)}</div><div class="price">${fmt(item.price)}</div></div>
      <button class="danger-text" data-id="${item.id}">刪除</button>`;
    list.appendChild(row);
  });
  list.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const it = menu.find(m=>m.id===id);
      if(it && !confirm(`確定要刪除「${it.name}」嗎？`)) return;
      menu = menu.filter(m => m.id !== id);
      await saveMenu();
      renderAll();
    });
  });
}

async function addMenuItem(){
  const nameInput = document.getElementById('new-item-name');
  const priceInput = document.getElementById('new-item-price');
  const name = nameInput.value.trim();
  const price = parseFloat(priceInput.value);
  if(!name || isNaN(price) || price < 0){ showToast('請輸入品項名稱與有效價格'); return; }
  menu.push({ id: uid(), name, price });
  await saveMenu();
  nameInput.value=''; priceInput.value='';
  renderAll();
  showToast('已新增品項');
}
document.getElementById('add-item-btn').addEventListener('click', addMenuItem);

async function bulkAddItems(){
  const raw = document.getElementById('bulk-menu').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length === 0){ showToast('請先貼上菜單內容'); return; }
  let added = 0;
  lines.forEach(line=>{
    const match = line.match(/^(.+?)[,\s]+\$?(\d+(?:\.\d+)?)\s*$/);
    if(match){
      const name = match[1].trim().replace(/[,，]+$/,'');
      const price = parseFloat(match[2]);
      if(name && !isNaN(price)){ menu.push({ id: uid(), name, price }); added++; }
    }
  });
  if(added === 0){ showToast('沒有辨識出品項，請確認格式為「名稱 價格」'); return; }
  await saveMenu();
  document.getElementById('bulk-menu').value = '';
  renderAll();
  showToast(`已新增 ${added} 個品項`);
}
document.getElementById('bulk-add-btn').addEventListener('click', bulkAddItems);

// ---------- OCR ----------
document.getElementById('menu-image-input').addEventListener('change', handleImageUpload);

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('讀取圖片失敗'));
    reader.readAsDataURL(file);
  });
}

async function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('image-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';

  const status = document.getElementById('ocr-status');
  const resultsEl = document.getElementById('ocr-results');
  const confirmBtn = document.getElementById('ocr-confirm-btn');
  resultsEl.innerHTML = '';
  confirmBtn.style.display = 'none';
  status.textContent = '辨識中，請稍候…';

  try{
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            { type: 'text', text: '這是一張菜單的照片。請幫我列出每一個餐點名稱與價格。只回傳 JSON，不要有任何說明文字或 Markdown 符號，格式為陣列：[{"name":"品項名稱","price":數字}]。如果某個品項看不出價格，price 填 null。品項名稱請保留原本語言（通常是中文）。' }
          ]
        }]
      })
    });
    if(!response.ok){ throw new Error('API 回應錯誤 ' + response.status); }
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock){ throw new Error('沒有取得辨識結果'); }
    let jsonText = textBlock.text.trim();
    jsonText = jsonText.replace(/^```json\s*/i, '').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const parsed = JSON.parse(jsonText);
    if(!Array.isArray(parsed) || parsed.length === 0){ throw new Error('沒有辨識到品項'); }
    ocrProposals = parsed.map(p => ({ name: String(p.name || '').trim(), price: (p.price === null || p.price === undefined || isNaN(p.price)) ? '' : Number(p.price) }))
      .filter(p => p.name);
    if(ocrProposals.length === 0){ throw new Error('沒有辨識到品項'); }
    status.textContent = `辨識到 ${ocrProposals.length} 個品項，請確認名稱與價格後加入菜單：`;
    renderOcrResults();
    confirmBtn.style.display = 'block';
  }catch(err){
    console.error(err);
    status.textContent = '辨識失敗：' + err.message + '。可以再試一次，或改用下方手動新增 / 貼上文字。';
  }
}

function renderOcrResults(){
  const resultsEl = document.getElementById('ocr-results');
  resultsEl.innerHTML = '';
  ocrProposals.forEach((p, idx)=>{
    const row = document.createElement('div');
    row.className = 'ocr-result-row';
    row.innerHTML = `
      <input type="checkbox" checked data-idx="${idx}" class="ocr-check">
      <div class="fields">
        <input type="text" class="name" value="${escapeHtml(p.name)}" data-idx="${idx}" data-field="name">
        <input type="number" class="price" value="${p.price}" data-idx="${idx}" data-field="price" placeholder="價格">
      </div>`;
    resultsEl.appendChild(row);
  });
  resultsEl.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = Number(inp.dataset.idx);
      ocrProposals[idx][inp.dataset.field] = inp.value;
    });
  });
}

document.getElementById('ocr-confirm-btn').addEventListener('click', async ()=>{
  const checks = document.querySelectorAll('.ocr-check');
  let added = 0;
  checks.forEach(chk=>{
    if(!chk.checked) return;
    const idx = Number(chk.dataset.idx);
    const p = ocrProposals[idx];
    const price = parseFloat(p.price);
    if(!p.name || isNaN(price) || price < 0) return;
    menu.push({ id: uid(), name: p.name, price });
    added++;
  });
  if(added === 0){ showToast('請確認勾選的品項都有名稱與價格'); return; }
  await saveMenu();
  renderAll();
  showToast(`已加入 ${added} 個品項到菜單`);
  document.getElementById('ocr-results').innerHTML = '';
  document.getElementById('ocr-confirm-btn').style.display = 'none';
  document.getElementById('ocr-status').textContent = '';
  document.getElementById('image-preview').style.display = 'none';
  document.getElementById('menu-image-input').value = '';
  ocrProposals = [];
});

// ---------- STATS ----------
function renderStats(){ renderStatsByPerson(); renderStatsByItem(); renderRemarks(); }

function renderStatsByPerson(){
  const el = document.getElementById('stats-person-table');
  if(orders.length === 0){ el.innerHTML = '<p class="empty">還沒有人送出訂單</p>'; return; }
  let grand = 0, rows = '';
  orders.forEach(o=>{
    const itemsText = o.items.map(it => `${it.name}×${it.qty}`).join('、');
    const subtotal = o.items.reduce((s,it)=> s + it.price*it.qty, 0);
    grand += subtotal;
    rows += `<tr>
      <td>${escapeHtml(o.name)}${o.remark ? `<div class="remark-tag">${escapeHtml(o.remark)}</div>` : ''}</td>
      <td>${escapeHtml(itemsText)}</td>
      <td class="num">${fmt(subtotal)}</td>
    </tr>`;
  });
  el.innerHTML = `<table><thead><tr><th>姓名</th><th>品項</th><th class="num">小計</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td colspan="2">總金額</td><td class="num">${fmt(grand)}</td></tr></tfoot></table>`;
}

function computeItemTotals(){
  const totals = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      if(!totals[it.itemId]) totals[it.itemId] = { name: it.name, price: it.price, qty: 0 };
      totals[it.itemId].qty += it.qty;
    });
  });
  return totals;
}

function renderStatsByItem(){
  const el = document.getElementById('stats-item-table');
  const totals = computeItemTotals();
  const keys = Object.keys(totals);
  if(keys.length === 0){ el.innerHTML = '<p class="empty">還沒有訂單資料</p>'; return; }
  let grand = 0, grandQty = 0, rows = '';
  keys.forEach(id=>{
    const t = totals[id];
    const subtotal = t.qty * t.price;
    grand += subtotal; grandQty += t.qty;
    rows += `<tr><td>${escapeHtml(t.name)}</td><td class="num">${t.qty}</td><td class="num">${fmt(subtotal)}</td></tr>`;
  });
  el.innerHTML = `<table><thead><tr><th>品項</th><th class="num">數量</th><th class="num">小計</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td>合計</td><td class="num">${grandQty}</td><td class="num">${fmt(grand)}</td></tr></tfoot></table>`;
}

function renderRemarks(){
  const el = document.getElementById('stats-remarks');
  const emptyMsg = document.getElementById('remarks-empty');
  const withRemark = orders.filter(o => o.remark);
  if(withRemark.length === 0){ el.innerHTML = ''; emptyMsg.style.display = 'block'; return; }
  emptyMsg.style.display = 'none';
  el.innerHTML = withRemark.map(o => `<div style="margin-bottom:8px;"><b>${escapeHtml(o.name)}</b>：${escapeHtml(o.remark)}</div>`).join('');
}

function buildOrderScript(){
  const totals = computeItemTotals();
  const parts = Object.values(totals).map(t => `${t.name} x${t.qty}`);
  let text = '訂購內容：' + parts.join('、') + '。';
  const remarks = orders.filter(o=>o.remark).map(o=>`${o.name}（${o.remark}）`);
  if(remarks.length){ text += '\n備註：' + remarks.join('；'); }
  return text;
}

// ---------- TABS ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});
document.querySelectorAll('.toggle-row button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.toggle-row button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('stats-byperson').style.display = btn.dataset.view === 'byperson' ? 'block' : 'none';
    document.getElementById('stats-byitem').style.display = btn.dataset.view === 'byitem' ? 'block' : 'none';
  });
});
document.getElementById('copy-order-script').addEventListener('click', ()=>{
  const text = buildOrderScript();
  const box = document.getElementById('copy-box');
  box.textContent = text;
  box.style.display = 'block';
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=> showToast('已複製到剪貼簿')).catch(()=>{}); }
});
document.getElementById('clear-orders-btn').addEventListener('click', async ()=>{
  if(orders.length === 0){ showToast('目前沒有訂單'); return; }
  if(!confirm('確定要清空所有人的訂單嗎？菜單設定會保留。')) return;
  orders = [];
  await saveOrders();
  renderAll();
  showToast('已清空所有訂單');
});

// ---------- ADMIN LOCK ----------
const lockModal = document.getElementById('lock-modal');
document.getElementById('open-admin-link').addEventListener('click', async ()=>{
  try{
    const p = await window.storage.get('admin_pin', true);
    adminPin = p ? p.value : null;
  }catch(e){ adminPin = null; }
  document.getElementById('lock-desc').textContent = adminPin ? '請輸入管理密碼' : '第一次使用，請設定一組後台密碼';
  document.getElementById('lock-error').style.display = 'none';
  document.getElementById('pin-input').value = '';
  lockModal.classList.add('show');
  document.getElementById('pin-input').focus();
});
document.getElementById('pin-cancel').addEventListener('click', ()=> lockModal.classList.remove('show'));
document.getElementById('pin-input').addEventListener('keydown', e => { if(e.key==='Enter') submitPin(); });
document.getElementById('pin-submit').addEventListener('click', submitPin);

async function submitPin(){
  const input = document.getElementById('pin-input');
  const val = input.value.trim();
  if(!val) return;
  if(!adminPin){
    adminPin = val;
    try{ await window.storage.set('admin_pin', adminPin, true); }catch(e){}
    unlockAdmin();
    showToast('已設定後台密碼，請妥善保管');
    return;
  }
  if(val === adminPin){ unlockAdmin(); }
  else{
    document.getElementById('lock-error').style.display = 'block';
    input.value = '';
  }
}

function unlockAdmin(){
  lockModal.classList.remove('show');
  document.querySelectorAll('.admin-tab').forEach(b => b.style.display = 'inline-block');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelector('button[data-tab="menu"]').classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-menu').classList.add('active');
  showToast('已進入後台管理');
}

loadData();
</script>
